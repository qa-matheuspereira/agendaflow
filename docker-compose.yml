version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agendaflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agendaflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agendaflow_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-agendaflow_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agendaflow} -d ${POSTGRES_DB:-agendaflow_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agendaflow_network

  redis:
    image: redis:7-alpine
    container_name: agendaflow_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-agendaflow_redis_pass} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-agendaflow_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agendaflow_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: agendaflow_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:redis:6379:0:${REDIS_PASSWORD:-agendaflow_redis_pass}"
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - agendaflow_network
    profiles:
      - tools

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agendaflow_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agendaflow.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agendaflow_network
    profiles:
      - tools

  evolution:
    image: atendai/evolution-api:v1.8.7
    container_name: agendaflow_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=agendaflow_evolution_key_2026
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UP=true
      - STORE_CONTACTS=true
      - STORE_CHATS=true
      - CLEAN_STORE_CLEANING_INTERVAL=7200
      - CLEAN_STORE_MESSAGES=true
      - CLEAN_STORE_MESSAGE_UP=true
      - CLEAN_STORE_CONTACTS=true
      - CLEAN_STORE_CHATS=true
      - LOG_LEVEL=ERROR
      - LOG_COLOR=false
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
    volumes:
      - evolution_store:/evolution/store
      - evolution_instances:/evolution/instances
      - ./patches/whatsapp.baileys.service.js:/evolution/dist/src/api/services/channels/whatsapp.baileys.service.js:ro
    networks:
      - agendaflow_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  evolution_store:
    driver: local
  evolution_instances:
    driver: local

networks:
  agendaflow_network:
    driver: bridge
